<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cómo trabajamos — Diplomatic Chile</title>
<template id="__bundler_thumbnail"><svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg"><rect width="80" height="56" fill="#0D1F3C"/><line x1="14" y1="40" x2="66" y2="40" stroke="#fff" stroke-width="2"/><circle cx="30" cy="40" r="5" fill="#fff"/></svg></template>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1F3C;--blue:#1A3A6B;--accent:#2D7DD2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;transition:background 900ms ease}
.stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 8%}
.labels{margin-bottom:4vh}
.labels div{font:600 clamp(20px,3.4vw,40px)/1.35 'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.4);letter-spacing:-0.01em;transition:color 500ms ease, transform 500ms ease}
.labels div.current{color:#fff}
.track-wrap{position:relative;width:100%;height:2px;background:rgba(255,255,255,.28)}
.fill{position:absolute;left:0;top:0;height:100%;background:#fff;width:0%}
.dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);left:0%;box-shadow:0 0 0 8px rgba(255,255,255,.15)}
.eyebrow{position:absolute;top:6%;left:8%;font:600 13px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.h1{position:absolute;top:6%;right:8%;font:700 22px/1 'Fraunces',serif;color:#fff;letter-spacing:-0.01em}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="eyebrow">Metodología</div>
<div class="h1">Cómo trabajamos</div>
<div class="stage">
  <div class="labels" id="labels"></div>
  <div class="track-wrap">
    <div class="fill" id="fill"></div>
    <div class="dot" id="dot"></div>
  </div>
</div>
<script>
const STEPS = ['Diagnóstico','Plan Operacional','Implementación','Supervisión','Control de Calidad','Indicadores','Mejora Continua'];
const COLORS = ['#0D1F3C','#15294F','#1A3A6B','#20406e','#1A3A6B','#15294F','#0D1F3C'];
const labelsWrap = document.getElementById('labels');
STEPS.forEach((t,i)=>{
  const d = document.createElement('div');
  d.textContent = t;
  d.id = 'label-'+i;
  labelsWrap.appendChild(d);
});
const dot = document.getElementById('dot');
const fill = document.getElementById('fill');
const bg = document.getElementById('bg');
const n = STEPS.length;
let idx = 0;
function tick(){
  const pct = (idx/(n-1))*100;
  dot.style.left = pct+'%';
  fill.style.width = pct+'%';
  bg.style.background = COLORS[idx];
  document.querySelectorAll('.labels div').forEach((el,i)=>el.classList.toggle('current', i===idx));
  idx = (idx+1) % n;
}
tick();
setInterval(tick, 2200);
</script>
</body>
</html>
