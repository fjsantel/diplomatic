<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GSAP preview</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0D1F3C}</style>
</head>
<body>
<svg class="logo" width="220" height="220" viewBox="0 0 220 220">
  <circle cx="110" cy="140" r="60" fill="#2D7DD2"/>
  <path class="top" d="M110 30 C130 70 150 95 150 120 C150 148 132 165 110 165 C88 165 70 148 70 120 C70 95 90 70 110 30Z" fill="#fff"/>
</svg>
<script>
gsap.timeline({repeat:-1, repeatDelay:1})
  .from(".top",{y:-18, duration:.7, ease:"back.out(2)"})
  .to(".top",{y:-3, duration:2, yoyo:true, repeat:1, ease:"sine.inOut"})
  .to(".logo",{scale:1.03, duration:3, yoyo:true, repeat:1, ease:"sine.inOut"},0);
</script>
</body>
</html>
